<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="妙妙小工具 - 一组实用的在线小工具集" />
    <title>妙妙小工具</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/hub.css" />
  </head>
  <body>
    <header class="hub-header">
      <h1>妙妙小工具</h1>
      <p>一组实用的在线小工具集合</p>
    </header>
    <main class="hub-main">
      <a class="tool-card" href="./tools/smith-chart/">
        <div class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="56" height="56">
            <defs><clipPath id="scUnit"><circle cx="50" cy="50" r="48" /></clipPath></defs>
            <circle cx="50" cy="50" r="48" fill="none" stroke="#25564b" stroke-width="2.6" />
            <line x1="2" y1="50" x2="98" y2="50" stroke="#25564b" stroke-width="1.4" />
            <circle cx="58" cy="50" r="40" fill="none" stroke="#25564b" stroke-width="1.2" />
            <circle cx="66" cy="50" r="32" fill="none" stroke="#25564b" stroke-width="1.2" />
            <circle cx="74" cy="50" r="24" fill="none" stroke="#25564b" stroke-width="1.2" />
            <circle cx="82" cy="50" r="16" fill="none" stroke="#25564b" stroke-width="1.2" />
            <circle cx="90" cy="50" r="8" fill="none" stroke="#25564b" stroke-width="1.2" />
            <g clip-path="url(#scUnit)" stroke="#7bb8a9" stroke-width="1.1" fill="none">
              <circle cx="98" cy="-190" r="240" />
              <circle cx="98" cy="290" r="240" />
              <circle cx="98" cy="-46" r="96" />
              <circle cx="98" cy="146" r="96" />
              <circle cx="98" cy="2" r="48" />
              <circle cx="98" cy="98" r="48" />
              <circle cx="98" cy="26" r="24" />
              <circle cx="98" cy="74" r="24" />
            </g>
            <circle cx="50" cy="50" r="2.2" fill="#25564b" />
          </svg>
        </div>
        <div class="tool-body">
          <h2>史密斯圆图 <span class="badge">Smith Chart</span></h2>
          <p>在线史密斯圆图工具：可视化并计算阻抗匹配，绘制 S 参数、驻波比、电阻/电抗圆与导纳。</p>
        </div>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>

      <a class="tool-card" href="./tools/bode-fano/">
        <div class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <rect x="6" y="12" width="52" height="40" rx="5" fill="none" stroke="#25564b" stroke-width="2" />
            <path d="M12 40 C 22 40, 22 24, 32 24 S 42 34, 52 34" fill="none" stroke="#25564b" stroke-width="2.2" stroke-linecap="round" />
            <path d="M12 34 H52" stroke="#7bb8a9" stroke-width="1.1" stroke-dasharray="3 3" />
            <circle cx="32" cy="24" r="2" fill="#25564b" />
          </svg>
        </div>
        <div class="tool-body">
          <h2>Bode-Fano 计算器 <span class="badge">Bode-Fano</span></h2>
          <p>依据 Bode-Fano 判据，计算 RC / RL 负载在给定带宽下可达到的最小反射系数，或给定反射系数下的最大带宽。</p>
        </div>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>

      <div class="tool-card tool-card--soon">
        <div class="tool-icon tool-icon--soon" aria-hidden="true">＋</div>
        <div class="tool-body">
          <h2>更多工具即将上线</h2>
          <p>这里会持续添加新的小工具，敬请期待。</p>
        </div>
      </div>
    </main>
    <footer class="hub-footer">
      <span>© <span id="year"></span> 妙妙小工具</span>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
